services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proofstudio_auth_smoke_test
      POSTGRES_USER: proofstudio_auth_smoke
      POSTGRES_PASSWORD: local_auth_smoke_password
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofstudio_auth_smoke -d proofstudio_auth_smoke_test"]
      interval: 2s
      timeout: 5s
      retries: 20
