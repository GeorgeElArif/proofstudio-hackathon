# ProofStudio PS-042B1 production release plan.
#
# This Blueprint is committed and locally validated only. Synchronizing it,
# creating resources, spending money, and claiming a deployment are outside
# this slice. Provider and B2 credentials are intentionally absent; all live
# operations remain default-deny.

previews:
  generation: off

services:
  - type: web
    runtime: python
    name: proofstudio-api
    region: oregon
    plan: starter
    rootDir: .
    healthCheckPath: /health
    autoDeployTrigger: off
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: PYTHONPATH=src uvicorn proofstudio.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROOFSTUDIO_ENV
        value: production
      - key: PROOFSTUDIO_RUN_LIVE_DEFAULT
        value: "false"
      - key: PROOFSTUDIO_LIVE_RUNS_ENABLED
        value: "false"
      - key: PROOFSTUDIO_B2_WRITES_ENABLED
        value: "false"
      - key: PROOFSTUDIO_PAID_RUN_APPROVED
        value: "false"
      - key: PROOFSTUDIO_IMPORT_BUCKET_ALIAS
        value: configured-import
      - key: PROOFSTUDIO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: proofstudio-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_PUBLIC_WEB_URL
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_CORS_ORIGINS
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_IMPORT_OPERATOR_TOKEN
        generateValue: true
      - key: PROOFSTUDIO_INTERNAL_SERVICE_TOKEN
        fromService:
          type: web
          name: proofstudio-auth
          envVarKey: PROOFSTUDIO_INTERNAL_SERVICE_TOKEN

  - type: web
    runtime: node
    name: proofstudio-auth
    region: oregon
    plan: starter
    rootDir: apps/auth-server
    healthCheckPath: /readyz
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run drizzle:migrate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROOFSTUDIO_ENV
        value: production
      - key: PROOFSTUDIO_SESSION_COOKIE_NAME
        value: proofstudio_session
      - key: PROOFSTUDIO_SESSION_COOKIE_SECURE
        value: "true"
      - key: PROOFSTUDIO_APP_BASE_URL
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_PUBLIC_WEB_URL
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_CORS_ORIGINS
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_PROOF_API_BASE_URL
        fromService:
          type: web
          name: proofstudio-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROOFSTUDIO_EMAIL_PROVIDER
        sync: false
      - key: PROOFSTUDIO_EMAIL_FROM
        sync: false
      - key: PROOFSTUDIO_EMAIL_API_KEY
        sync: false
      - key: PROOFSTUDIO_DISPOSABLE_EMAIL_BLOCKLIST_SOURCE
        sync: false
      - key: PROOFSTUDIO_AUTH_SECRET
        generateValue: true
      - key: PROOFSTUDIO_INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: PROOFSTUDIO_DATABASE_URL
        fromDatabase:
          name: proofstudio-db
          property: connectionString

  - type: web
    runtime: static
    name: proofstudio-web
    rootDir: apps/web
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_PROOFSTUDIO_API_BASE_URL
        fromService:
          type: web
          name: proofstudio-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_PROOFSTUDIO_AUTH_BASE_URL
        fromService:
          type: web
          name: proofstudio-web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /auth/*
        destination: https://proofstudio-auth.onrender.com/auth/*
      - type: rewrite
        source: /session
        destination: https://proofstudio-auth.onrender.com/session
      - type: rewrite
        source: /logout
        destination: https://proofstudio-auth.onrender.com/logout
      - type: rewrite
        source: /account/*
        destination: https://proofstudio-auth.onrender.com/account/*
      - type: rewrite
        source: /healthz
        destination: https://proofstudio-auth.onrender.com/healthz
      - type: rewrite
        source: /readyz
        destination: https://proofstudio-auth.onrender.com/readyz
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /auth/*
        name: Cache-Control
        value: no-store
      - path: /session
        name: Cache-Control
        value: no-store
      - path: /logout
        name: Cache-Control
        value: no-store
      - path: /account/*
        name: Cache-Control
        value: no-store
      - path: /healthz
        name: Cache-Control
        value: no-store
      - path: /readyz
        name: Cache-Control
        value: no-store

databases:
  - name: proofstudio-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: proofstudio
    user: proofstudio
    ipAllowList: []
